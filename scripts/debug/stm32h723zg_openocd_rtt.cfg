source [find interface/stlink.cfg]

transport select swd

adapter speed 100

reset_config srst_only srst_nogate connect_assert_srst srst_open_drain

source [find target/stm32h7x.cfg]

# Avoid H7 DBGMCU probing issues
catch {stm32h7x_dbgmcu_mmw}

init

rtt setup 0x24000000 4096 "SEGGER RTT"
rtt server start 9090 0

proc rtt_start_retry {{tries 10} {delay_ms 100}} {
    for {set i 0} {$i < $tries} {incr i} {
        if {[catch {rtt start}] == 0} {
            echo "RTT: Control block gefunden"
            return
        }
        sleep $delay_ms
    }
    echo "RTT: Kontrollblock nach $tries Versuchen nicht gefunden"
}

stm32h7x.cpu0 configure -event resume-end {
    rtt_start_retry
}

reset halt
